# Microservicio CURSOS: catálogo de cursos y secciones.
# KV como caché (cache-aside) porque es lo más leído el día de matrícula.
name = "matricula-cursos"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
preview_urls = false

[observability]
enabled = true

[[d1_databases]]
binding = "DB_CURSOS"
database_name = "cursos-db"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
