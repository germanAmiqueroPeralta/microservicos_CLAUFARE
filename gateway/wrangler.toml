# API GATEWAY: la única puerta de entrada pública.
# - Sirve la aplicación React (carpeta "public", generada por "npm run build -w web").
# - Autentica (JWT en cookie HttpOnly) y enruta /api/* a cada microservicio.
# Secreto requerido: JWT_SECRET (el script de despliegue lo crea automáticamente).
name = "matricula-gateway"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[[services]]
binding = "ESTUDIANTES"
service = "matricula-estudiantes"

[[services]]
binding = "CURSOS"
service = "matricula-cursos"

[[services]]
binding = "MATRICULA"
service = "matricula-matricula"

[[services]]
binding = "PAGOS"
service = "matricula-pagos"

[[services]]
binding = "NOTIFICACIONES"
service = "matricula-notificaciones"
