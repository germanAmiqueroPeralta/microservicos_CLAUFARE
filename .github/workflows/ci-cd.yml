# CI/CD del sistema de matrícula.
# - CI: en cada push y pull request compila la web y valida que los 6 Workers empaqueten (sin desplegar).
# - CD: si el CI pasa en la rama main, despliega todo en Cloudflare con scripts/deploy.mjs.
# Secretos requeridos en GitHub: CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nunca dos despliegues a la vez; un push nuevo no cancela un despliegue en curso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Compilar y validar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar la web (React)
        run: npm run build -w web
      - name: Validar los Workers (dry-run)
        run: |
          for servicio in estudiantes cursos notificaciones matricula pagos gateway; do
            echo "::group::$servicio"
            npx wrangler deploy --dry-run -c $servicio/wrangler.toml
            echo "::endgroup::"
          done

  deploy:
    name: Desplegar en Cloudflare
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Desplegar todo el sistema
        run: npm run desplegar
